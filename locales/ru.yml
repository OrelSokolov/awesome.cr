# Каталог сообщений на русском — вшивается в бинарник при компиляции
# (см. src/awesome/i18n.cr). Ключи плоские, через точку; назначение
# смотрите в locales/en.yml. Формы множественного числа — подтки
# .one/.few/.many/.other с аргументом count.
"cli.banner": |-
  awesome — ваш код на Crystal awesome или awful?

  Использование:

    awesome [paths]            Проверить пути всеми гардами (по умолчанию: текущая папка, с учётом awesome.yml)
    awesome speed [paths]      Только гарды скорости
    awesome memory [paths]     Только гарды памяти
    awesome code [paths]       Только гарды качества кода
    awesome allocations [paths] Построчный отчёт об аллокациях (красные аллоцируют, зелёные чистые, серые неопределённые)
    awesome doc [GUARD]        Документация одного гарда или всех сразу
    awesome guards             Список зарегистрированных гардов (всего, по уровням и видам)

  Опции:
"cli.opt.config": "Путь к awesome.yml (по умолчанию: ./awesome.yml или ./.awesome.yml)"
"cli.opt.level": "Проверять до уровня: %{levels} (по умолчанию: %{default})"
"cli.opt.only": "Запустить только эти гарды"
"cli.opt.except": "Запустить все, кроме этих гардов"
"cli.opt.lang": "Язык сообщений: %{languages} (по умолчанию: из переменной LANG, иначе %{default})"
"cli.opt.scope": "отчёт allocations: разгадывать вызовы в пределах одного файла или всего проекта: %{scopes} (по умолчанию: %{default})"
"cli.errors.unknown_option": "неизвестная опция: %{option}"
"cli.errors.missing_value": "не хватает значения для %{option}"
"cli.errors.unknown_level": "неизвестный уровень: %{level} (доступны: %{available})"
"cli.errors.unknown_level_config": "неизвестный уровень в awesome.yml: %{level} (доступны: %{available})"
"cli.errors.unknown_lang": "неизвестный язык: %{lang} (доступны: %{available})"
"cli.errors.unknown_scope": "неизвестный scope: %{scope} (доступны: %{available})"
"cli.errors.unknown_lang_config": "неизвестный язык в awesome.yml: %{lang} (доступны: %{available})"
"cli.errors.no_such_guard": "нет такого гарда: %{names}"
"cli.errors.available": "Доступны: %{guards}"
"cli.errors.config_parse": "ошибка разбора конфига: %{message}"
"cli.guards.registered.one": "awesome %{version} — зарегистрирован %{count} гард"
"cli.guards.registered.few": "awesome %{version} — зарегистрировано %{count} гарда"
"cli.guards.registered.many": "awesome %{version} — зарегистрировано %{count} гвардов"
"doc.good_example": "Хороший пример:"
"doc.bad_example": "Плохой пример:"
"report.inspected.one": "Проверен %{count} файл"
"report.inspected.few": "Проверено %{count} файла"
"report.inspected.many": "Проверено %{count} файлов"
"report.issues.one": "%{count} проблема"
"report.issues.few": "%{count} проблемы"
"report.issues.many": "%{count} проблем"
"report.summary": "%{inspected}, найдено %{issues}"
"report.awesome": "Ваш код — awesome."
"report.awful": "Ваш код — awful: %{issues}."
"allocations.legend": "красные строки — аллоцируют (сами или через вызов; строка def аллоцирующего метода тоже красная), зелёные — доказанно без аллокаций, серые — undefined: цель вызова вне scope, нужно дальнейшее исследование"
"allocations.header": "%{path} — красных %{red}, серых %{gray}, зелёных %{green}"
"allocations.summary": "файлов %{files}: красных строк %{red}, серых %{gray}, зелёных %{green}"
"source.skipping": "пропускаю %{path}: %{message}"
"guards.LongParameterList.main.one": "%{label} принимает %{count} параметр (порог: %{threshold}) — сверните их в одно понятие или разбейте метод"
"guards.LongParameterList.main.few": "%{label} принимает %{count} параметра (порог: %{threshold}) — сверните их в одно понятие или разбейте метод"
"guards.LongParameterList.main.many": "%{label} принимает %{count} параметров (порог: %{threshold}) — сверните их в одно понятие или разбейте метод"
"guards.UtilityClass.main.one": "%{display}: единственный метод — классовый, и экземпляры не создаются — это пространство имён, а не тип; сделайте его модулем (вызовы вида %{display}.method останутся рабочими)"
"guards.UtilityClass.main.few": "%{display}: все %{count} метода — классовые, и экземпляры не создаются — это пространство имён, а не тип; сделайте его модулем (вызовы вида %{display}.method останутся рабочими)"
"guards.UtilityClass.main.many": "%{display}: все %{count} методов — классовые, и экземпляры не создаются — это пространство имён, а не тип; сделайте его модулем (вызовы вида %{display}.method останутся рабочими)"
"guards.GodClass.methods.one": "%{count} метод"
"guards.GodClass.methods.few": "%{count} метода"
"guards.GodClass.methods.many": "%{count} методов"
"guards.GodClass.ivars.one": "%{count} ивар"
"guards.GodClass.ivars.few": "%{count} ивара"
"guards.GodClass.ivars.many": "%{count} иваров"
"guards.GodClass.main": "%{display}: %{methods} и %{ivars} — слишком много для одного класса (пороги: %{methods_threshold} методов / %{ivars_threshold} иваров); разделите ответственности"
"guards.DeepInheritance.main.one": "%{name} углублён на %{count} уровень в %{chain} — предпочитайте композицию (лучше иметь коллаборатора, чем быть им)"
"guards.DeepInheritance.main.few": "%{name} углублён на %{count} уровня в %{chain} — предпочитайте композицию (лучше иметь коллаборатора, чем быть им)"
"guards.DeepInheritance.main.many": "%{name} углублён на %{count} уровней в %{chain} — предпочитайте композицию (лучше иметь коллаборатора, чем быть им)"
"guards.JunkFile.classes.one": "%{count} класс в одном файле (%{names}) — мусорка с кодом: один класс на файл, остальных разнесите по своим файлам"
"guards.JunkFile.classes.few": "%{count} класса в одном файле (%{names}) — мусорка с кодом: один класс на файл, остальных разнесите по своим файлам"
"guards.JunkFile.classes.many": "%{count} классов в одном файле (%{names}) — мусорка с кодом: один класс на файл, остальных разнесите по своим файлам"
"guards.JunkFile.nested_modules.one": "модуль %{name} содержит %{count} вложенный модуль (%{names}) — не больше одного вложенного модуля в модуле; разнесите их по своим папкам и файлам"
"guards.JunkFile.nested_modules.few": "модуль %{name} содержит %{count} вложенных модуля (%{names}) — не больше одного вложенного модуля в модуле; разнесите их по своим папкам и файлам"
"guards.JunkFile.nested_modules.many": "модуль %{name} содержит %{count} вложенных модулей (%{names}) — не больше одного вложенного модуля в модуле; разнесите их по своим папкам и файлам"
"guards.JunkFile.nested_classes.one": "класс %{name} содержит %{count} вложенный класс (%{names}) — не больше одного вложенного класса в классе; разнесите их по своим папкам и файлам"
"guards.JunkFile.nested_classes.few": "класс %{name} содержит %{count} вложенных класса (%{names}) — не больше одного вложенного класса в классе; разнесите их по своим папкам и файлам"
"guards.JunkFile.nested_classes.many": "класс %{name} содержит %{count} вложенных классов (%{names}) — не больше одного вложенного класса в классе; разнесите их по своим папкам и файлам"


"guards.AggregateAfterTransform.main": "map { … }.%{name} выделяет промежуточный Array лишь затем, чтобы сразу агрегировать его; %{fix}"
"guards.ArrayConcatInLoop.main": "Array += в цикле копирует весь Array на каждой итерации (в сумме O(n²)); вместо этого добавляйте на месте через <<"
"guards.ArrayShiftInLoop.main": "#%{name} в цикле — O(n) на каждый вызов для Array (O(n²) на весь цикл); используйте Deque для работы с очередью"
"guards.BoolBitmask.main": "%{count} полей Bool занимают %{count} байт; enum с @[Flags] упаковывает их в 1 (например, %{first} | %{last})"
"guards.BoolFlagParameter.main": "%{method_possessive} %{param} — флаговый аргумент: вызывается и с true, и с false — два поведения за одним именем; два метода (например, %{method} / %{method}!) скажут то же без ветвления"
"guards.CliStdoutEpipe.main": "%{what} — конвейер в head/less убивает процесс ошибкой `IO::Error: Broken pipe` посреди вывода; перехватите `IO::Error` в точке входа и выйдите с кодом 0, если os_error равен EPIPE"
"guards.DoubleFree.main": "`%{lib}.%{fun}(%{var})` освобождает `%{var}` повторно: он уже был освобождён в строке %{line}, и `%{var}` между этими вызовами не переприсваивался — двойное освобождение портит C-кучу"
"guards.FileReadLines.main": "File.read_lines читает весь файл в память до использования первой строки; File.each_line читает потоком с плоским расходом памяти"
"guards.HardcodedDependency.main": "%{owner} сам создаёт %{path}.new (%{where}) — но работает с %{abstraction}, где реализаций — %{impls_count} (%{impls}); передавайте зависимость снаружи, приваренная строка обходит шов"
"guards.InclusiveRangeIndex.main": "последний `%{index}` цикла равен `%{recv}.size`, и `%{recv}[%{index}]` вызывает IndexError — используйте исключающий диапазон `0...%{recv}.size` или `%{recv}.size.times`"
"guards.IndexLookahead.main": "`%{recv}[%{index} + %{offset}]` выходит за конец: последний `%{index}` цикла равен `%{recv}.size - 1`, поэтому доступ попадает в индекс `%{recv}.size` — защитите последнюю итерацию или выполните цикл до `%{recv}.size - %{offset}`"
"guards.InterpIntoIo.main": "Интерполяция внутри %{call} сначала выделяет String целиком (String.interpolation); добавляйте части по отдельности — io << \"a=\" << a"
"guards.LogEagerInterp.main": "%{receiver}.%{level} \"…\" собирает String, даже когда уровень отключён; блочная форма %{receiver}.%{level} { \"…\" } интерполирует только при выводе"
"guards.MapCompact.main": "map { … }.compact обходит промежуточный Array во второй раз; compact_map собирает не-nil результаты за один проход"
"guards.MapFlatten.main": "map { … }.flatten выделяет промежуточный Array; flat_map строит результат за один проход"
"guards.MemoryLeak.main": "`%{lib}.%{fun}` %{owner} выделяет память в C-куче, но `%{lib}.%{free}` в проекте не вызывается ни разу: дополните выделение памяти в C освобождением (например, в `#finalize` или `#close`)"
"guards.NilableStructField.main": "Поле '%{field}' — union, допускающий nil: %{size} байт вместо %{payload} плюс ветвление при каждом обращении; используйте sentinel-значение или отдельный флаг Bool"
"guards.NotImplementedOverride.main": "%{subclass}#%{method} лишь бросает NotImplementedError, а %{parent}#%{method} — конкретный: подкласс не может встать там, где стоял родитель; сохраните поведение, не наследуйте его или объявите метод abstract в родителе"
"guards.PointerOfEscape.assign": "`%{target} = %{value}` фиксирует адрес, но не его владельца: объект, содержащий переменную, управляется GC, а поле хранит только сырой адрес — после сборки указатель повисает. Держите владельца живым рядом с полем или выделите память через malloc и владейте ею явно"
"guards.PointerOfEscape.main": "`%{expr}` передан в `%{lib}.%{fun}`: адрес стабилен, но его владелец управляется GC и невидим для C — после сборки владельца библиотека пишет через висячий указатель. Передайте значение, которое C скопирует, используйте удерживаемый живым Box (см. UnpinnedLibCallback), или выделите память через malloc и владейте ею явно"
"guards.RaiseInFunDef.main": "`%{name}` внутри определения `fun`: исключение, покидающее точку входа ABI, раскручивает кадры C-вызывающего — неопределённое поведение, на практике аварийное завершение вдали от бага. Ловите исключение внутри fun и возвращайте код ошибки"
"guards.RaiseInLibCallback.main": "`raise` внутри колбэка, переданного в `%{call}`: исключение, возбуждённое в Crystal-коде, вызванном из C, раскручивает C-кадры библиотеки — неопределённое поведение, на практике аварийное завершение. Сообщайте об ошибке через возвращаемое значение колбэка или перехватывайте её внутри колбэка"
"guards.SelectCompareZero.main": "select { … }.%{name}%{arg} строит отфильтрованный Array лишь для сравнения с нулём; %{replacement} отвечает без него"
"guards.SelectFirst.main": "select { … }.%{name} выделяет весь отфильтрованный Array ради одного элемента; %{replacement} возвращает первое совпадение без него"
"guards.SelfSizeIndex.main": "индексация по размеру самой коллекции: `%{what}`%{origin} идёт на единицу за конец — последний допустимый индекс — `size - 1`"
"guards.SelfSortReassign.main": "Присваивание '%{target}' его собственному результату #%{name} платит за никому не нужную копию; используйте #%{name}! на месте — это безопасно, пока ничто другое не ссылается на '%{target}'"
"guards.SingleCharStringArg.main": "%{name} со строковыми литералами из одного символа сравнивает String целиком; перегрузка Char %{name}(%{char_args}) сравнивает коды символов напрямую"
"guards.SingleSubclass.main": "%{subclass} — единственный подкласс %{parent}: единственный наследник покупает косвенность, а не полиморфизм; используйте композицию (держите %{parent_segment} как соучастника) или объедините два класса в один"
"guards.SliceAsCString.main": "`%{expr}` передаётся в `%{param}` lib-функции `%{lib}.%{fun}` (параметр C-строки) без аргумента длины в вызове: если получатель — Slice, его байты не завершены NUL, и чтение их со стороны C как строки выходит за границы буфера (неопределённое поведение). Передавайте рядом `x.size`, копируйте через `String.new(x)` или объявите lib-функцию как `(data : UInt8*, len : Int32)`"
"guards.StoredLibPointer.main": "`%{target} = %{value}` хранит сырой указатель из `%{lib}` в поле: сохраняет ли C владение (заимствование может стать висячим, когда C освобождает или перевыделяет память) или передаёт его (возникает утечка, если никто его не освободит) — это контракт, который поле не выражает. Оберните его в явный `#close`/`#finalize` или скройте за дескриптором в таблице на стороне Crystal"
"guards.StringConcatInLoop.main": "Конкатенация строк в цикле реаллоцирует память на каждой итерации; добавляйте в IO::Memory (или String::Builder) и соберите String один раз"
"guards.StructurePacking.main": "Переупорядочьте поля struct по убыванию выравнивания (сначала самые широкие): sizeof может сократиться с %{current} до %{optimal} байт"
"guards.SubclassNoOverride.main": "%{subclass} не переопределяет ни одного метода %{parent} — наследование ради переиспользования кода, а не полиморфизм; держите %{parent_segment} как соучастника вместо того, чтобы быть им"
"guards.TimesIndex.main": "%{recv}.size.times { |%{index}| … } заново получает элементы через индекс с проверкой границ; %{recv}.each { |x| } отдаёт их напрямую"
"guards.ToSWithoutIo.main": "def to_s без аргумента IO никогда не работает там, где это важно: io <<, интерполяция и puts вызывают to_s(io : IO) — определите `def to_s(io : IO)` и пишите прямо в io"
"guards.ToUnsafeEscape.main": "`%{target} = ... .to_unsafe` хранит сырой указатель, но не объект, в который он ведёт: GC не сканирует память C, поэтому объект с байтами может быть собран, и указатель повисает. Держите владельца живым рядом с указателем или скопируйте байты в память, принадлежащую C"
"guards.ToUnsafeEscape.return": "`return ... .to_unsafe` выдаёт наружу сырой указатель в кучу GC: как только владелец становится недостижим, коллектор может освободить байты, и указатель у вызывающей стороны повисает. Возвращайте сам String/Slice или скопируйте байты в память, принадлежащую C"
"guards.UncheckedLibPointer.main": "`%{call}.value` разыменовывает указатель, возвращённый `%{lib}.%{fun}`, сразу на месте: C-функция, возвращающая `T*`, может вернуть NULL — сохраните результат в переменную и сначала проверьте его (`if ptr = %{lib}.%{fun}(...)`)"
"guards.UncheckedLibPointer.stored": "`%{var}.value` разыменовывает указатель `%{var}`, полученный из `%{assign}` в строке %{line}, без проверки на NULL между ними: C-функция, возвращающая `T*`, может вернуть NULL — сначала `if %{var}` / `%{var}.nil?`"
"guards.UnpinnedLibCallback.boxed": "`%{box}` передан инлайн в `%{call}`: бокс управляется GC и не имеет ссылок после возврата из вызова — если библиотека сохраняет указатель, бокс может быть собран, и последующий `Box.unbox` из C станет use-after-free. Храните бокс в константе или переменной класса и передавайте его"
"guards.UnpinnedLibCallback.main": "замыкание передано инлайн в `%{call}`: если библиотека сохраняет его, после возврата из вызова ничто на стороне Crystal не ссылается на проц, и GC может его освободить — следующий колбэк из C станет use-after-free. Присвойте проц константе или переменной класса и передавайте его (или закрепите через `GC.add_root`)"
"guards.UnusedIndex.main": "индекс блока '%{index}' никогда не используется; обычный `each` делает ту же работу и не ведёт индексную бухгалтерию"
