# awesome.yml — configuration for the awesome linter (rubocop.yml-style,
# with guards instead of cops). Drop it in your project root; awesome
# also works without one (sane defaults, all guards enabled).
#
# Docs for every guard: `awesome doc` or docs/guards/ in the repository.

# Check level (cumulative), picked by how long the code will live:
# vibecoder (features first — don't break on first run) < senior
# (long-life code, readability-neutral best practices — the default) <
# psycho (readability traded for micro-wins; experiments and hard
# requirements only, e.g. io << "a=" << a). This repo dogfoods at full
# strictness:
level: psycho

include:
  - src/**/*.cr
  - spec/**/*.cr

exclude:
  - lib/**
  - .carat/**
  - bin/**
  - builds/**

guards:
  StructurePacking:
    enabled: true
    # @[Extern] structs must mirror a C header byte-for-byte, so by
    # default they are only checked when you opt in:
    check_extern: false
  MemoryLeak:
    enabled: true
    # fun names treated as C allocators / deallocators (exact match);
    # a file that allocates via a lib shim must free via the same lib:
    # allocators: [malloc, calloc, realloc, xmalloc, strdup]
    # deallocators: [free, xfree]
  DoubleFree:
    enabled: true
    # the same pointer must not reach a deallocator twice without a
    # reassignment in between (same deallocator names as MemoryLeak):
    # deallocators: [free, xfree]
  RaiseInLibCallback:
    enabled: true
    # raise/reraise inside a proc handed to a lib-shim fun unwinds
    # through C frames — undefined behaviour; no extra config
  UncheckedLibPointer:
    enabled: true
    # .value on a T*-returning lib fun's result with no null check
    # in between (chained or stored in a local/ivar); no extra config
  UnpinnedLibCallback:
    enabled: true
    # a proc literal or Box.box passed inline to a storing lib fun
    # (set_/register_/on_/... names) — the GC can free the closure;
    # extra fun names that store their callback:
    # storage_funs: [run_with]
    # storing-looking names that actually don't store (suppression):
    # ignore_funs: [on_init]
  ToUnsafeEscape:
    enabled: true
    # x.to_unsafe stored in an ivar/class var/constant or returned —
    # the pointer outlives the GC-managed bytes; no extra config
  RaiseInFunDef:
    enabled: true
    # raise/reraise inside a `fun` def (a C entry point) escapes into
    # the caller's foreign frames — undefined behaviour; no extra
    # config
  SliceAsCString:
    enabled: true
    # x.to_unsafe passed to a UInt8*/Int8*/Char* param of a lib fun
    # with no length argument — a Slice receiver is not NUL-terminated;
    # argument names that count as "a length travels with it":
    # length_names: [size, bytesize, length, len, count, cap]
  StoredLibPointer:
    enabled: true
    # a raw pointer from a lib fun stored in an ivar/class var/const —
    # ownership is a C-side contract the field doesn't express;
    # allocator funs are MemoryLeak's concern, skipped here:
    # allocators: [malloc, calloc, realloc, xmalloc, strdup]
  PointerOfEscape:
    enabled: true
    # pointerof(x) handed to a storing lib fun or kept in a field —
    # the address outlives its GC-managed owner; extra fun names that
    # store their argument:
    # storage_funs: [observe]
    # storing-looking names that actually don't store (suppression):
    # ignore_funs: [register_my_thread]
  HardcodedDependency:
    enabled: true
    # fires only on a proven seam (an abstraction with 2+ project
    # implementations that the same class declares in a type
    # annotation); the whitelist below carves out exceptions:
    # allowed: [SomeConcrete]
  GodClass:
    enabled: true
    # max_methods: 25
    # max_ivars: 10
  LongParameterList:
    enabled: true
    # fire above this many parameters per def (5 = strict):
    # max_params: 7
  BoolFlagParameter:
    enabled: true
    # param names never flagged (both true and false literals at call
    # sites are required to fire at all):
    # allowed: [quiet]
  ToSWithoutIo:
    enabled: true
    # a zero-arg `to_s` override never runs on the io <</interpolation
    # paths; switch off if the zero-arg form is deliberate API:
    # check_to_s: true
  JunkFile:
    enabled: true
    # one class per file, one nested module per module, one nested
    # class per class — no thresholds, no extra config
